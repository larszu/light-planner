name: Release build

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

# Kein FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 mehr. Hier stand "Drop this once
# checkout/setup-node ship v5" -- die gibt es laengst, und upload-artifact,
# download-artifact und action-gh-release haben inzwischen ebenfalls
# node24-Majors. Die Sha-Pins zeigten weiter auf v4.x: ein Sha ist gut gegen
# Tag-Verschiebung und schlecht gegen Vergessen, denn man sieht ihm nicht an,
# wie alt er ist. `npm run actions:check` sieht deshalb in jeder action.yml
# nach, statt sich auf den Kommentar daneben zu verlassen.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev || true

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Building version $VERSION from tag $TAG"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid signing certificate available. The macOS config requests an
          # ad-hoc signature ("identity": "-") so Apple Silicon Gatekeeper
          # accepts the binary instead of rejecting it with "Light Planner is
          # damaged and can't be opened". We deliberately do NOT set
          # CSC_IDENTITY_AUTO_DISCOVERY=false here: in electron-builder 26 that
          # flag short-circuits the explicit ad-hoc identity and falls back to a
          # fully-unsigned binary, which arm64 macOS refuses to launch.
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Light Planner ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
