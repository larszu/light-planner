name: CI

# Der Merge-Gate. Selbst-Merge ist nur bei gruenem CI erlaubt — auf Pull
# Requests lief bisher aber gar kein Check, den es haette gruen oder rot
# machen koennen: release.yml haengt an Tags.
#
# Neben Lint und Build laufen hier die drei Austauschformat-Waechter mit.
# Genau sie halten fest, dass `.avplan`, das Venue-Format und
# `avplan-inventory` in allen drei Planern identisch bleiben — ein Drift
# darin faellt sonst erst auf, wenn ein Import beim Nutzer scheitert.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Wire-Contract — avplan-inventory
        run: npm run inventory:check
      - name: Wire-Contract — .avplan
        run: npm run avplan:check
      - name: Wire-Contract — Venue-Austausch
        run: npm run venue:check
      - name: Projekt-Identitaet (Versionen, Geraete-Liste)
        run: npm run identity:check
      - name: i18n — erreichbare Oberflaeche uebersetzt
        run: npm run i18n:check

      - name: MVR-Export — Fixture-Typ-Identitaet
        run: npm run mvr:check

      - name: Herkunft der Kenndaten
        run: npm run spec:check

      # INTEGRATION.md war bis 2026-09-04 von keiner Einstiegsseite aus
      # verlinkt -- also ausgerechnet das Dokument, das die Einbettung in den
      # cable-planner beschreibt.
      - name: Dokumentation ist auffindbar
        run: npm run docs:check

      # Zuletzt und bewusst: dieser Lauf prueft, dass die Liste darueber
      # vollstaendig ist. `mvr:check` fehlte hier bis 2026-09-04 — er
      # existierte, war gruen, und lief bei keinem Merge.
      # Fragt die action.yml jedes Pins nach ihrer Node-Version, statt sie in
      # einem Kommentar zu behaupten. `release.yml` pinnt per Sha -- gut gegen
      # Tag-Verschiebung, schlecht gegen Vergessen: am 2026-09-05 zeigten alle
      # vier Shas noch auf v4.x, also node20, und der Kommentar daneben sagte
      # "Drop this once checkout/setup-node ship v5", die es laengst gab.
      - name: Actions laufen auf einer unterstuetzten Node-Version
        run: npm run actions:check

      - name: Jeder Pruef-Lauf steht auch im Workflow
        run: npm run ci:complete
      - name: Build (inkl. Type-Check)
        run: npm run build
